name: "ONNX ASR Polish"
description: "Parakeet + FastConformer Polish models (Wyoming)"
version: "1.1.2"
slug: onnx_polish
init: false
arch:
  - aarch64
  - amd64
startup: services
ports:
  10300/tcp: 10300
  10301/tcp: 10301
ports_description:
  10300/tcp: "Parakeet (Wyoming)"
  10301/tcp: "FastConformer (Wyoming)"
options:
  parakeet_model: "OpenVoiceOS/yuriyvnv-parakeet-tdt-0.6b-pl-onnx"
  fastconformer_model: "OpenVoiceOS/stt_pl_fastconformer_hybrid_large_pc_onnx"
  quantization_parakeet: "int8"
  quantization_fastconformer: "none"
schema:
  parakeet_model: str
  fastconformer_model: str
  quantization_parakeet: list(none|int8|fp16)
  quantization_fastconformer: list(none|int8|fp16)
